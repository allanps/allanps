<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
<rect width="760" height="318" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect width="760" height="30" rx="10" fill="#161b22"/><rect y="20" width="760" height="10" fill="#161b22"/>
<circle cx="20" cy="15.0" r="6" fill="rgb(255,95,86)"/>
<circle cx="40" cy="15.0" r="6" fill="rgb(255,189,46)"/>
<circle cx="60" cy="15.0" r="6" fill="rgb(39,201,63)"/>
<text x="380.0" y="19.0" fill="#8b949e" text-anchor="middle" font-size="12">agentcore — deterministic core, LLM at the edges</text>
<text x="18" y="60" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">python -m agentcore.demo</tspan></text>
<text x="18" y="81" xml:space="preserve"><tspan fill=" "></tspan></text>
<text x="18" y="102" xml:space="preserve"><tspan fill="#c9d1d9">T-1003  Suspicious login from another country</tspan><tspan fill="#8b949e">   # fake model said: priority=low</tspan></text>
<text x="18" y="123" xml:space="preserve"><tspan fill="#c9d1d9">    priority : </tspan><tspan fill="#f0883e" font-weight="bold">HIGH</tspan><tspan fill="#8b949e">   core overrode the model</tspan></text>
<text x="18" y="144" xml:space="preserve"><tspan fill="#c9d1d9">    queue    : security</tspan></text>
<text x="18" y="165" xml:space="preserve"><tspan fill="#c9d1d9">    human    : required</tspan></text>
<text x="18" y="186" xml:space="preserve"><tspan fill=" "></tspan></text>
<text x="18" y="207" xml:space="preserve"><tspan fill="#c9d1d9">T-1004  How do I add a teammate?</tspan></text>
<text x="18" y="228" xml:space="preserve"><tspan fill="#c9d1d9">    reply    : ... </tspan><tspan fill="#58a6ff" font-weight="bold">[REDACTED_EMAIL] [REDACTED_CARD]</tspan><tspan fill="#8b949e">   PII scrubbed by the core</tspan></text>
<text x="18" y="249" xml:space="preserve"><tspan fill=" "></tspan></text>
<text x="18" y="270" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">pytest -q</tspan></text>
<text x="18" y="291" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#3fb950" font-weight="bold">449 passed</tspan><tspan fill="#8b949e">   0 of 336 adversarial outputs broke a core invariant</tspan></text>
</svg>